name: CI

on:
  push:
    branches: [DEV, main]
  pull_request:
    branches: [DEV, main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # Keep CI off the paid embedding path: the offline backend is deterministic,
  # so index rebuilds and retrieval checks need no secret.
  RAG_EMBEDDING_MODEL: hashing

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q --junit-xml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml

  index:
    name: Rebuild index
    needs: test
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ steps.build.outputs.documents }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ingest,tracking]"

      # The real corpus lives behind the DVC remote. When credentials for it are
      # configured, reproduce the pipeline for real; otherwise fall back to the
      # committed fixture so the stages are still exercised on every push.
      - name: Pull data (DVC)
        id: dvc
        continue-on-error: true
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$DVC_REMOTE_URL" ]; then
            echo "DVC_REMOTE_URL not set; will use the committed fixture corpus."
            exit 1
          fi
          dvc remote modify --local storage url "$DVC_REMOTE_URL"
          dvc pull
          echo "pulled=true" >> "$GITHUB_OUTPUT"

      - name: Build index
        id: build
        run: |
          if [ "${{ steps.dvc.outcome }}" = "success" ]; then
            echo "::notice::Reproducing the pipeline from DVC-tracked data"
            dvc repro
            documents=$(python -c "import json;print(json.load(open('faiss_ev/index_meta.json'))['documents'])")
          else
            echo "::warning::DVC remote unavailable - building from tests/fixtures/corpus.json"
            export RAG_CORPUS_JSON="$PWD/tests/fixtures/corpus.json"
            rag-ingest
            documents=$(python -c "import json;print(json.load(open('faiss_ev/index_meta.json'))['documents'])")
          fi
          echo "documents=$documents" >> "$GITHUB_OUTPUT"
          test "$documents" -gt 0

      - name: Check the index answers a query
        run: |
          if [ "${{ steps.dvc.outcome }}" != "success" ]; then
            export RAG_CORPUS_JSON="$PWD/tests/fixtures/corpus.json"
          fi
          python - <<'PY'
          from rag_service.config import get_settings
          from rag_service.ingest.citations import format_citation
          from rag_service.ingest.pipeline import count_documents, load_index

          store = load_index(get_settings())
          print("vectors:", count_documents(store))
          hits = store.similarity_search("obligations of the seller", k=3)
          assert hits, "index returned nothing"
          print("citations:", [format_citation(d.metadata) for d in hits])
          PY

      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: faiss-index
          path: faiss_ev/
          retention-days: 7

  faithfulness:
    name: RAGAS faithfulness gate
    needs: index
    runs-on: ubuntu-latest
    # Forks cannot read secrets, so the gate would be meaningless there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ingest,tracking,ragas]"

      - name: Download index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: faiss_ev/

      - name: Require the API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::The faithfulness gate needs the OPENAI_API_KEY secret."
            echo "RAGAS judges answers with an LLM; without a key the gate cannot run,"
            echo "and passing it silently would be worse than failing."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Fails the build when faithfulness falls below the threshold.
      - name: Evaluate faithfulness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          rag-eval \
            --questions data/ragas_questions.json \
            --min-faithfulness 0.75 \
            --report reports/ragas.json

      - name: Upload RAGAS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: reports/ragas.json

  image:
    name: Build and push image
    needs: faithfulness
    runs-on: ubuntu-latest
    # Only publish from the branches themselves, never from a pull request.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: faiss_ev/

      # The Dockerfile copies these; make sure they exist even when the DVC
      # remote was unavailable and the index came from the fixture.
      - name: Ensure data directories exist
        run: |
          mkdir -p data files
          [ -f data/corpus.json ] || cp tests/fixtures/corpus.json data/corpus.json

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run -d --name rag -p 8000:8000 \
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health && break || sleep 2
          done
          curl -s localhost:8000/health | tee /tmp/health.json
          python -c "import json;d=json.load(open('/tmp/health.json'));assert d['status']=='healthy',d;assert d['documents_indexed']>0,d"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/ask \
            -H 'content-type: application/json' -d '{"question":"  "}')
          test "$code" = "422" || { echo "empty question returned $code, expected 422"; exit 1; }
          docker rm -f rag
